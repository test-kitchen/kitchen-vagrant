---
name: 'Lint, Unit & Integration Tests'

'on':
  pull_request:

jobs:
  lint-unit:
    uses: test-kitchen/.github/.github/workflows/lint-unit.yml@main

  integration:
    runs-on: ubuntu-latest
    needs: lint-unit
    name: Kitchen Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4"]
        os: ["almalinux-9", "ubuntu-2404"]

    steps:
      - name: Install VirtualBox
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          wget -O- https://www.virtualbox.org/download/oracle_vbox_2016.asc | gpg --dearmor | sudo tee /usr/share/keyrings/oracle-virtualbox-2016.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          echo "deb [signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list
          sudo apt-get update
          sudo apt-get install -y software-properties-common libarchive-tools vagrant virtualbox-7.2
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Setup Machine
        run: |
          bundle config set --local with 'integration'
          bundle install
          # Create a wrapper for vagrant that completely isolates it from bundler
          mkdir -p bin
          cat > bin/vagrant << 'EOF'
          #!/usr/bin/env bash
          # Run vagrant with a completely clean Ruby environment
          env -i \
            PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            HOME="$HOME" \
            USER="$USER" \
            LOGNAME="$LOGNAME" \
            /usr/bin/vagrant "$@"
          EOF
          chmod +x bin/vagrant
          export PATH="$(pwd)/bin:$PATH"
          # Verify vagrant works
          vagrant --version
      - name: Verify Cinc gems are loaded
        # Cinc republishes patched inspec gems under the same name and version as
        # Chef's, so a stale bundler cache can leave Chef's licensed gems on disk
        # even when the lockfile points at rubygems.cinc.sh. Fail loudly if so.
        run: bundle exec ruby -e 'require "inspec/dist"; abort "Chef InSpec gems loaded instead of Cinc - clear the bundler cache" if Inspec::Dist::EXEC_NAME == "inspec"'
      - name: Kitchen Doctor
        run: |
          export PATH="$(pwd)/bin:$PATH"
          bundle exec kitchen doctor ${{ matrix.os }}
      - name: Kitchen Test
        # `test` rather than `verify`, so that destroy runs too. `verify`
        # leaves the machine up and the driver's destroy path -- `vagrant
        # destroy -f` and the removal of the instance sandbox -- is never
        # exercised against a real Vagrant.
        run: |
          export PATH="$(pwd)/bin:$PATH"
          bundle exec kitchen test ${{ matrix.os }}
      - name: Confirm the instance was destroyed
        run: |
          export PATH="$(pwd)/bin:$PATH"
          bundle exec kitchen list ${{ matrix.os }}
          test ! -d ".kitchen/kitchen-vagrant/default-${{ matrix.os }}"
